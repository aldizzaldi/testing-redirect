<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IKEA App Redirect Test</title>
<script src="redirect.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:560px;margin:0 auto;padding:16px;line-height:1.5}
.box{padding:12px;border-radius:8px;background:#f1f3f5;margin:12px 0}
.warn{background:#fff4e0}
a.btn{display:inline-block;background:#0058a3;color:#fff;padding:10px 16px;border-radius:20px;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<h1>Halaman Test (Home)</h1>
<div id="status" class="box">Memeriksa…</div>
<p><a href="product.html?id=123">Buka halaman produk (deep link test)</a></p>
<p><a href="?">Reset (hapus flag di URL)</a> · buka tab baru untuk reset flag sesi</p>
<div class="box">
  Tombol install (seperti di web asli):<br><br>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.exmaple.skateboard">Install di Play Store</a>
</div>
<script>
  var fromFallback = new URLSearchParams(location.search).get('no_app_redirect') === '1';
  var el = document.getElementById('status');
  if (fromFallback) { el.className = 'box warn'; el.textContent = 'Balik dari fallback: app tidak terbuka / tidak terinstall.'; }
  else if (!/Android/i.test(navigator.userAgent)) el.textContent = 'Bukan Android, redirect tidak jalan.';
  else el.textContent = 'Kalau kamu masih melihat ini, app tidak terbuka otomatis (atau sudah dicoba di sesi ini).';
</script>
</body>
</html>
